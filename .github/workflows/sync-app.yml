name: Sync current PageMaker Pro app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore current working app.py
        env:
          PAYLOAD: |
            

      - name: Commit restored app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || (git commit -m "Upload current PageMaker Pro app" && git push)
